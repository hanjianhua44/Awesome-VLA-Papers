target_count: 20
minimum_score: 4.5
candidate_keyword_floor: 3
max_per_topic: 6
max_per_primary_institution: 5
minimum_per_domain:
  ad: 3

weights:
  keyword: 4.0
  curated_similarity: 5.0
  institution: 2.0
  priority: 3.0
  robotics_category: 0.5

priority_patterns:
  - '\bvision.language.action\b|\bVLA\b'
  - '\bworld.action model\b|\bWAM\b'
  - 'recursive self.improvement|physical.{0,5}RSI|self.evolv'
  - 'agentic.{0,12}robot|skill.{0,8}harness'
  - 'action token|action chunk|visuomotor policy'
  - 'end.to.end.{0,12}(driving|autonomous)'

weak_cv_patterns:
  - 'image classification'
  - 'object detection'
  - 'semantic segmentation'
  - 'image generation'
  - '3D reconstruction'
  - 'depth estimation'

